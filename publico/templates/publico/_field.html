{# Sub-template reutilizable — los widgets reciben la clase visual en forms.py y site.css #}
<div>
  <label for="{{ field.id_for_label }}" class="field-label">
    {{ field.label }}{% if required %} <span class="text-red-500">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<p class="mt-2 text-xs leading-5 text-[#718078]">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}
    <p class="mt-2 flex items-start gap-1.5 text-xs leading-5 text-red-600">
      <svg class="mt-0.5 h-3.5 w-3.5 shrink-0" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
      {{ field.errors|join:", " }}
    </p>
  {% endif %}
</div>
